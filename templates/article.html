<script>
  // View counts & share handlers for static pages
  var pageId = window.location.pathname.split('/').pop().replace('.html', '');
  var views = window.CH ? window.CH.incViews(pageId) : 1;
  var vEl = document.getElementById('aViews');
  if (vEl) vEl.innerHTML = '<span>👁️ ' + views + ' views</span>';

  var currUrl = encodeURIComponent(window.location.href);
  var shareText = encodeURIComponent(document.title);
  var xBtn = document.getElementById('shareX');
  if (xBtn) xBtn.href = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + currUrl;
  var wsBtn = document.getElementById('shareWS');
  if (wsBtn) wsBtn.href = 'https://api.whatsapp.com/send?text=' + shareText + '%20' + currUrl;
  var cpBtn = document.getElementById('shareCopy');
  if (cpBtn) {
    cpBtn.onclick = function (e) {
      e.preventDefault();
      navigator.clipboard.writeText(window.location.href).then(function () {
        var tip = document.createElement('div');
        tip.className = 'copied-tip show';
        tip.textContent = 'Link copied to clipboard! ✨';
        document.body.appendChild(tip);
        setTimeout(function () { tip.classList.remove('show'); setTimeout(function () { tip.remove(); }, 300); }, 2000);
      });
    };
  }
</script>
